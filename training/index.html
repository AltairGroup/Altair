<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Подключение к обучению</title><style>body{font-family:Arial,sans-serif;background:#f5f6f8;margin:0;display:grid;place-items:center;min-height:100vh;color:#222}.card{background:white;width:min(88%,430px);padding:34px;border-radius:16px;box-shadow:0 8px 30px #0002;text-align:center}.cam{font-size:52px}h2{margin:12px 0}.loader{height:6px;background:#eee;border-radius:5px;overflow:hidden;margin:25px 0}.bar{height:100%;width:0;background:#2d8cff;animation:load 6s linear forwards}@keyframes load{to{width:100%}}#prank{display:none;font-size:28px;font-weight:700}.small{color:#666;font-size:14px}</style></head><body><div class="card"><div id="loading"><div class="cam">🎥</div><h2>Подключение к обучению</h2><p id="status">Проверка участника…</p><div class="loader"><div class="bar"></div></div><div class="small">Не закрывайте страницу</div></div><div id="prank">😂 А ТЫ ПОВЁЛСЯ!<br><br>ИДИ РАБОТАЙ!</div></div><script>setTimeout(()=>status.textContent='Загрузка учебных материалов…',2500);setTimeout(()=>{loading.style.display='none';prank.style.display='block'},6200)</script></body></html>
